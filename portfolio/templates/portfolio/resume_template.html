<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Резюме</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        h1 { color: #111; }
        .section { margin-bottom: 20px; }
        .skill { display: inline-block; background: #eee; padding: 4px 12px; border-radius: 12px; margin: 4px; }
    </style>
</head>
<body>
    <h1>{{ name }}</h1>
    <p><strong>{{ title }}</strong></p>

    <div class="section">
        <h2>Навыки</h2>
        {% for skill in skills %}
            <span class="skill">{{ skill }}</span>
        {% endfor %}
    </div>

    <div class="section">
        <h2>Опыт</h2>
        {% for exp in experience %}
            <p><strong>{{ exp.company }}</strong> — {{ exp.position }} ({{ exp.years }})</p>
        {% endfor %}
    </div>

    <div class="section">
        <h2>Образование</h2>
        <p>{{ education }}</p>
    </div>
</body>
</html>
