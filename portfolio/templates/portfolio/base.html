{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO-метатеги -->
    <title>{% block title %}Моё портфолио{% endblock %}</title>
    <meta name="description" content="{% block description %}Портфолио разработчика на Python и Django. Минималистичные сайты с душой.{% endblock %}">
    
    <!-- OpenGraph (для соцсетей) -->
    <meta property="og:title" content="{% block og_title %}Моё портфолио{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Портфолио разработчика на Python и Django.{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <meta property="og:image" content="{% block og_image %}{% static 'portfolio/images/og-image.jpg' %}{% endblock %}">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}Моё портфолио{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Портфолио разработчика на Python и Django.{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}{% static 'portfolio/images/og-image.jpg' %}{% endblock %}">
    
    <!-- Фавикон -->
    <link rel="icon" type="image/x-icon" href="{% static 'portfolio/images/favicon.ico' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'portfolio/images/apple-touch-icon.png' %}">
    
    <!-- Шрифты и стили -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">
</head>
<body>
    <!-- Спиннер загрузки -->
        <div id="loader-wrapper">
            <div class="loader"></div>
        </div>

    <!-- Хедер -->
    <header class="header">
        <div class="container">
            <a href="{% url 'home' %}" class="logo">.kernels</a>
            <div class="header-right">
                <nav class="nav">
                    <a href="{% url 'home' %}#about">Обо мне</a>
                    <a href="{% url 'home' %}#skills">Навыки</a>
                    <a href="{% url 'home' %}#projects">Проекты</a>
                    <a href="{% url 'contacts' %}">Контакты</a>
                    <a href="{% url 'resume_page' %}" style="display: inline-flex; align-items: center; gap: 4px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Резюме
                    </a>
                </nav>
                <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" aria-label="Переключить тему">
                    <span class="theme-icon">⚪️</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main>
        {% block content %}
        <!-- Сюда будет вставляться содержимое каждой страницы -->
        {% endblock %}
    </main>

    <!-- Подвал -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>© 2026 Руслан. Сделано на Django 🖤</p>
                <div class="footer-social">
                    <a href="https://github.com/Kernelsss" target="_blank" class="social-icon">GitHub</a>
                    <a href="https://t.me/shibaroy?ysclid=msitf9qqek200245457" target="_blank" class="social-icon">Telegram</a>
                    <a href="mailto:kernels@internet.ru" class="social-icon">Email</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Скрипты -->
    <script>
        // Анимация при скролле
        const animateElements = document.querySelectorAll('.scroll-animate');
        function checkVisibility() {
            const windowHeight = window.innerHeight;
            animateElements.forEach(el => {
                const rect = el.getBoundingClientRect();
                if (rect.top < windowHeight - 100) {
                    el.classList.add('visible');
                }
            });
        }
        window.addEventListener('load', checkVisibility);
        window.addEventListener('scroll', checkVisibility);
    </script>

    <script>
        function toggleTheme() {
            var body = document.body;
            body.classList.toggle('dark-theme');
            var isDark = body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            var icon = document.querySelector('#theme-toggle .theme-icon');
            if (icon) {
                icon.textContent = isDark ? '⚫️' : '⚪️';
            }
        }
    // ...
        document.addEventListener('DOMContentLoaded', function() {
            var theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.body.classList.add('dark-theme');
                var icon = document.querySelector('#theme-toggle .theme-icon');
                if (icon) icon.textContent = '⚫️';
            }
        });
    </script>

    <script>
        // Скрыть спиннер после полной загрузки страницы
        window.addEventListener('load', function() {
            const loader = document.getElementById('loader-wrapper');
            if (loader) {
                loader.classList.add('hidden');
            }
        });

        // Показывать спиннер при клике на любую ссылку (кроме якорных и внешних)
        document.addEventListener('click', function(e) {
            const target = e.target.closest('a');
            if (target && target.href && !target.href.startsWith('#') && target.hostname === window.location.hostname) {
                const loader = document.getElementById('loader-wrapper');
                if (loader) {
                    loader.classList.remove('hidden');
                }
            }
        });
</script>
</body>
</html>
